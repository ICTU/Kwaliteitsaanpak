<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <title>ICTU Kwaliteitsaanpak Softwareontwikkeling</title>
        <link rel="stylesheet" href="/Kwaliteitsaanpak/index.css" />
        <script>
            // GitHub Pages serves this page for all paths that don't exist. Redirect paths that start with /latest
            // to the latest release, e.g. /latest/ICTU-Kwaliteitsaanpak.html#m16 to
            // /v5.4.0/ICTU-Kwaliteitsaanpak.html#m16. Update the version when releasing a new version.
            const latestVersion = "v5.4.0";
            const match = location.pathname.match(/^\/Kwaliteitsaanpak\/latest(\/.*)?$/);
            if (match) {
                const path = match[1] && match[1] !== "/" ? `${latestVersion}${match[1]}` : "";
                location.replace(`/Kwaliteitsaanpak/${path}${location.search}${location.hash}`);
            }
        </script>
    </head>
    <body>
        <img class="logo" src="/Kwaliteitsaanpak/ICTU.png" alt="ICTU-logo" />
        <h1 class="title">ICTU Kwaliteitsaanpak Softwareontwikkeling</h1>
        <p>Deze pagina bestaat niet. Ga naar de <a href="/Kwaliteitsaanpak/">homepage</a> voor een overzicht van de documenten.</p>
    </body>
</html>
